org: josephcaba
service: api-alumnos-rds

provider:
  name: aws
  runtime: python3.13
  memorySize: 1024
  timeout: 20
  iam:
    role: arn:aws:iam::944585571319:role/LabRole
  environment:
    DB_SECRET_NAME: rds_mysql_alumnos/user_${sls:stage}
    DB_USER: user_${sls:stage}
    DB_NAME: ${sls:stage}

functions:
  listar:
    handler: ListarAlumnos.lambda_handler
    package:
      include:
        - ./**
    events:
      - http:
          path: /alumnos/listar
          method: get
          cors: true
          integration: lambda
